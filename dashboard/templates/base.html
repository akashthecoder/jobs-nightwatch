<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Jobs NightWatch{% endblock %}</title>
<style>
  :root {
    --bg:#0f1115; --panel:#171a21; --line:#262b36; --text:#e6e8ee;
    --muted:#8b93a5; --accent:#7aa2f7; --good:#7ee787; --warn:#f0a868;
    --off:#6b7280; --gone:#f07a7a;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  .wrap { max-width:1060px; margin:0 auto; padding:26px 20px 80px; }
  a { color:inherit; }

  header { border-bottom:1px solid var(--line); padding-bottom:16px; margin-bottom:20px; }
  h1 { margin:0 0 5px; font-size:25px; letter-spacing:-.3px; }
  .tag { color:var(--muted); font-size:14px; }

  /* summary bar -- conveys scale and freshness at a glance */
  .stats { display:flex; flex-wrap:wrap; gap:0; background:var(--panel);
           border:1px solid var(--line); border-radius:10px; margin-bottom:8px; }
  .stat { flex:1 1 120px; padding:13px 16px; border-right:1px solid var(--line); }
  .stat:last-child { border-right:none; }
  .stat .n { font-size:21px; font-weight:700; line-height:1.15; }
  .stat .l { font-size:11px; text-transform:uppercase; letter-spacing:.6px;
             color:var(--muted); margin-top:2px; }
  .stat.live .n { color:var(--good); }

  .flash { padding:10px 14px; border-radius:8px; margin-bottom:14px; font-size:14px; }
  .flash.ok { background:#12301c; border:1px solid #1f5c33; color:#9ae6b4; }
  .flash.err { background:#3a1a1a; border:1px solid #6b2b2b; color:#ffb4b4; }

  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.7px;
       color:var(--muted); margin:30px 0 11px; font-weight:600; }

  .panel { background:var(--panel); border:1px solid var(--line);
           border-radius:10px; padding:14px 16px; }
  .companies { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { display:flex; align-items:center; gap:7px; background:#1e2330;
          border:1px solid var(--line); border-radius:20px; padding:5px 12px; font-size:13px; }
  .chip.off { opacity:.4; }
  .dot { width:7px; height:7px; border-radius:50%; background:var(--good); }
  .chip.off .dot { background:var(--off); }
  .chip .sub { color:var(--muted); font-size:11px; }
  .chip button { background:none; border:none; color:var(--muted);
                 cursor:pointer; font-size:11px; padding:0; text-decoration:underline; }

  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px;
          padding:15px 17px; margin-bottom:11px; }
  .card.attn { border-left:3px solid var(--accent); }
  .card.gone { border-left:3px solid var(--gone); opacity:.9; }
  .card.dim  { opacity:.6; padding:11px 17px; }

  .row { display:flex; justify-content:space-between; gap:14px; align-items:flex-start; }
  .title { font-weight:600; font-size:16px; }
  .title a { text-decoration:none; }
  .title a:hover { color:var(--accent); }
  .title.struck { text-decoration:line-through; color:var(--muted); }
  .meta { color:var(--muted); font-size:12.5px; margin-top:3px; }

  .scorebox { text-align:right; min-width:56px; }
  .score { font-size:21px; font-weight:700; line-height:1; }
  .bar { height:3px; background:#2a3040; border-radius:2px; margin-top:5px; overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--accent); }

  .badge { display:inline-block; font-size:10px; text-transform:uppercase;
           letter-spacing:.6px; padding:2px 7px; border-radius:4px; margin-right:6px;
           vertical-align:2px; font-weight:600; }
  .b-new { background:#1c3a5e; color:#9ec5ff; }
  .b-modified { background:#5a4218; color:#f5c97a; }
  .b-removed { background:#5a2020; color:#ffa8a8; }

  /* the hero element: what actually changed */
  .changed { margin:12px 0 4px; padding:11px 14px; background:#221d10;
             border:1px solid #4a3a18; border-radius:8px; }
  .changed .lab { font-size:10px; text-transform:uppercase; letter-spacing:.7px;
                  color:var(--warn); font-weight:700; margin-bottom:4px; }
  .gone-note { margin:11px 0 4px; padding:11px 14px; background:#241616;
               border:1px solid #4a2020; border-radius:8px; font-size:14px; }

  .headline { margin:10px 0 0; }
  ul { margin:8px 0 0; padding-left:18px; }
  li { margin-bottom:5px; }
  .concerns li { color:var(--warn); }
  details { margin-top:9px; }
  summary { cursor:pointer; color:var(--muted); font-size:12.5px; }
  .btn { background:var(--accent); color:#0d1117; border:none; padding:8px 16px;
         border-radius:7px; font-weight:600; cursor:pointer; font-size:14px; }
  .empty { color:var(--muted); padding:24px; text-align:center; }
  form.inline { display:inline; }

  /* company filter chips */
  .chip.filter { text-decoration:none; cursor:pointer; }
  .chip.filter:hover { border-color:var(--accent); }
  .chip.filter.active { border-color:var(--accent); background:#1d2740; }
  .chip-link { display:flex; align-items:center; gap:7px; text-decoration:none; color:inherit; }
  .chip .sub b { color:var(--accent); }

  /* matching-roles list */
  .mrow { display:flex; align-items:center; gap:12px; padding:10px 16px;
          border-bottom:1px solid var(--line); }
  .mrow:last-child { border-bottom:none; }
  .mtitle { flex:1; min-width:0; }
  .mtitle a { text-decoration:none; font-weight:500; }
  .mtitle a:hover { color:var(--accent); }
  .strength { font-size:10px; text-transform:uppercase; letter-spacing:.6px;
              font-weight:700; padding:2px 7px; border-radius:4px; min-width:58px;
              text-align:center; }
  .s-high { background:#14361f; color:#7ee787; }
  .s-medium { background:#2f2a12; color:#e3c76a; }
  .assessed { font-size:11px; color:var(--accent); white-space:nowrap; }
  .unassessed { font-size:11px; color:var(--off); white-space:nowrap; }
  .hdr-row { display:flex; justify-content:space-between; align-items:center; gap:12px; }

  /* nav tabs */
  .nav { display:flex; gap:4px; margin:14px 0 4px; }
  .nav a { padding:7px 15px; border-radius:8px 8px 0 0; text-decoration:none;
           color:var(--muted); font-size:14px; font-weight:500;
           border:1px solid transparent; border-bottom:none; }
  .nav a:hover { color:var(--text); }
  .nav a.on { background:var(--panel); border-color:var(--line);
              color:var(--text); }
  .prose { max-width:760px; }
  .prose p { margin:0 0 14px; }
  .prose h3 { font-size:17px; margin:26px 0 8px; }
  .prose ul { margin:0 0 14px; padding-left:20px; }
  .prose li { margin-bottom:7px; }
  .lead { font-size:17px; line-height:1.6; color:var(--text); }
  .callout { background:var(--panel); border:1px solid var(--line);
             border-left:3px solid var(--accent); border-radius:8px;
             padding:14px 17px; margin:18px 0; }
  .callout.warn { border-left-color:var(--warn); }
  code { background:#1e2330; padding:1px 5px; border-radius:4px;
         font-size:13px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
  .diagram { width:100%; max-width:920px; height:auto; }
  .legend { display:flex; flex-wrap:wrap; gap:14px; margin:14px 0 6px; font-size:13px; }
  .legend span { display:flex; align-items:center; gap:6px; color:var(--muted); }
  .sw { width:12px; height:12px; border-radius:3px; display:inline-block; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Jobs NightWatch</h1>
    <div class="tag">Job boards show you what exists. This shows you what <em>changed</em>.</div>
  </header>

  <div class="nav">
    <a href="/" class="{% if page == 'dashboard' %}on{% endif %}">Dashboard</a>
    <a href="/about" class="{% if page == 'about' %}on{% endif %}">About</a>
    <a href="/architecture" class="{% if page == 'architecture' %}on{% endif %}">Architecture</a>
  </div>

{% block content %}{% endblock %}

</div>
</body>
</html>
